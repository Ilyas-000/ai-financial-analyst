[project]
name = "ai-financial-analyst"
version = "0.1.0"
description = "AI financial analyst for a BaaS partner — LangGraph + Postgres + Qdrant + Ollama"
requires-python = ">=3.12"
dependencies = [
    # Orchestration & LLM
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    # Umbrella package required only by langfuse.langchain.CallbackHandler
    # (I-10). All node code keeps importing from langchain-core directly.
    "langchain>=1.0",
    # Vector / retrieval
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "FlagEmbedding>=1.3",
    "langchain-text-splitters>=0.3",
    "python-frontmatter>=1.1",
    "tiktoken>=0.8",
    # SQL / DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "sqlglot>=25.0",
    "sqlparse>=0.5",
    # Tools
    "asteval>=1.0",
    "httpx>=0.27",
    # Web / API / UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "chainlit>=1.3",
    # Cross-cutting
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # v4 SDK uses langfuse.langchain.CallbackHandler against the langchain
    # umbrella; v2 SDK's callback path (langchain.callbacks.base) is dead in
    # langchain v1.x, so v4 is the only working integration today. Server in
    # docker-compose is v3 — v3 server accepts ingestion from v4 client.
    "langfuse>=4.5,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "faker>=33",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
